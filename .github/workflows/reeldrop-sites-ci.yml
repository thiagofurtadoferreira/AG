name: ReelDrop Sites frontend CI

on:
  push:
    branches: [chatgpt-sites-reeldrop]
  pull_request:
    branches: [chatgpt-sites-reeldrop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
